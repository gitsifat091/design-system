<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neomorphism</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; overflow:visible; }
  .accent { fill:var(--accent); }
  .ink { fill:var(--ink); }
  .well { fill:var(--surface-sunken); }
  .mat { fill:var(--surface); }
  .raise { filter: drop-shadow(8px 8px 8px var(--shadow-dark)) drop-shadow(-8px -8px 8px var(--shadow-light)); }
  .raise-sm { filter: drop-shadow(4px 4px 4px var(--shadow-dark)) drop-shadow(-4px -4px 4px var(--shadow-light)); }
  .words { position:absolute; left:var(--space-12); bottom:var(--space-12); max-width:440px; }
  .name { margin:0; font-size:64px; line-height:.95; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      surface slab 208x208 raised (raised-md light/dark pair) · accent pill 160x48 · ink disc 64 · surface-sunken well 144x64 · about 30% of 960x288
  arrangement one big raised slab with satellites, all inside x 480..960, space-12 margins
  pattern     raised discs and pills from "soft, generous radii, one material": four surface discs at a space-12 pitch, extruded with the system's own two shadows
  scales      sides in space-4 multiples; gaps space-6; corners radius-lg on the slab, radius-md on the well, pill rx half the short side
-->
<rect class="mat raise" x="48" y="40" width="208" height="208" rx="24"/>
<rect class="accent raise-sm" x="88" y="160" width="128" height="48" rx="24"/>
<circle class="ink" cx="152" cy="104" r="32"/>
<rect class="well" x="296" y="40" width="144" height="64" rx="16"/>
<circle class="mat raise-sm" cx="320" cy="152" r="16"/>
<circle class="mat raise-sm" cx="368" cy="152" r="16"/>
<circle class="mat raise-sm" cx="416" cy="152" r="16"/>
<circle class="accent raise-sm" cx="320" cy="200" r="16"/>
<rect class="mat raise-sm" x="352" y="184" width="88" height="32" rx="16"/>
</svg>
</div>
<div class="words">
<h1 class="name">Neomorphism</h1>
<p class="tag">Soft UI carved from one material.</p>
</div>
</div>
</body>
</html>
