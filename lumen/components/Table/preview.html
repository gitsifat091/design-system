<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table</title>
<style>
  html, body { margin: 0; background: var(--bg); }

</style>
</head>
<body>
<div id="root" class="lm-root"></div>
<script>

var L = window.Lumen, h = React.createElement;
function Row(label, kids, opts) {
  opts = opts || {};
  return h('div', { style: { display: 'grid', gridTemplateColumns: (opts.w || 96) + 'px 1fr', gap: 'var(--space-4)', alignItems: 'center' } },
    h('span', { style: { fontSize: 11, lineHeight: '16px', fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--fg-muted)' } }, label),
    h('div', { className: 'lm-row' }, kids));
}
function mount(App) { ReactDOM.createRoot(document.getElementById('root')).render(h(App)); }

mount(function () {
  var tone = { Paid: 'success', Open: 'primary', Overdue: 'warning', Failed: 'danger' };
  var icon = { Paid: 'check', Open: null, Overdue: 'alert', Failed: 'x' };
  return h('div', { className: 'lm-pad' }, h(L.Table, {
    caption: 'Recent invoices',
    columns: [
      { key: 'customer', label: 'Customer', render: function (r) { return h('div', { className: 'lm-cell-main' }, h(L.Avatar, { name: r.customer, size: 'sm', tone: 'neutral' }), h('div', null, r.customer, h('span', { className: 'lm-cell-sub' }, r.email))); } },
      { key: 'id', label: 'Invoice', render: function (r) { return h('span', { className: 'lm-mono' }, r.id); } },
      { key: 'status', label: 'Status', render: function (r) { return h(L.Badge, { tone: tone[r.status], icon: icon[r.status] }, r.status); } },
      { key: 'date', label: 'Due' },
      { key: 'amount', label: 'Amount', align: 'right' },
      { key: 'menu', label: '', width: 48, render: function () { return h(L.Button, { variant: 'ghost', size: 'sm', icon: 'more', 'aria-label': 'Row actions' }); } }
    ],
    rows: [
      { id: 'INV-2041', customer: 'Globex Corp', email: 'accounts@globex.com', status: 'Paid', date: 'Oct 2, 2026', amount: '$4,200.00' },
      { id: 'INV-2040', customer: 'Initech', email: 'ap@initech.io', status: 'Open', date: 'Oct 18, 2026', amount: '$1,150.00', _state: 'hover' },
      { id: 'INV-2039', customer: 'Umbrella Health', email: 'finance@umbrella.health', status: 'Overdue', date: 'Sep 28, 2026', amount: '$9,875.50' },
      { id: 'INV-2038', customer: 'Hooli', email: 'billing@hooli.xyz', status: 'Failed', date: 'Sep 21, 2026', amount: '$640.00' }
    ]
  }));
});
</script>
</body>
</html>
