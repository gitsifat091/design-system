<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog</title>
<style>
  html, body { margin: 0; background: var(--bg); }

</style>
</head>
<body>
<div id="root" class="lm-root"></div>
<script>

var L = window.Lumen, h = React.createElement;
function Row(label, kids, opts) {
  opts = opts || {};
  return h('div', { style: { display: 'grid', gridTemplateColumns: (opts.w || 96) + 'px 1fr', gap: 'var(--space-4)', alignItems: 'center' } },
    h('span', { style: { fontSize: 11, lineHeight: '16px', fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--fg-muted)' } }, label),
    h('div', { className: 'lm-row' }, kids));
}
function mount(App) { ReactDOM.createRoot(document.getElementById('root')).render(h(App)); }

mount(function () {
  var B = L.Button;
  return h('div', { style: { position: 'relative', height: 360, background: 'var(--bg)' } },
    h('div', { className: 'lm-pad lm-muted' }, 'Page content behind the scrim'),
    h(L.Dialog, { open: true, inline: true, tone: 'danger', icon: 'trash', title: 'Delete workspace?', description: 'Northwind and its 14 projects will be permanently deleted. This cannot be undone.', onClose: function () {},
      footer: [h(B, { key: 1, variant: 'secondary' }, 'Cancel'), h(B, { key: 2, variant: 'danger' }, 'Delete workspace')] },
      h(L.Checkbox, { label: 'I understand that all invoices will be deleted' })));
});
</script>
</body>
</html>
