<!-- @dsCard height=320 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 320px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 320px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 320px; overflow: visible; }
  .brand { fill: var(--primary); }
  .ink { fill: var(--fg); }
  .tint { fill: var(--primary-soft); }
  .signal { fill: var(--warning); }
  .blk { rx: var(--radius-lg); }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-size: 120px; line-height: .92; font-weight: 600; letter-spacing: -0.045em; color: var(--fg); }
  .tag { margin: var(--space-3) 0 0 6px; font-size: 14px; line-height: 20px; color: var(--fg-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320">
<!--
  blocks      primary 144x264 slab bled off the top (the one brand blue, largest) · fg 160x208 bleeding off the right edge (the deep ink) · primary-soft tiles (the tint) · warning 32px disc once (a state colour, kept small) ≈ 32% of 960x320
  arrangement one tall primary slab with a modular grid of satellites; bottoms on one line space-4 above the edge; space-4 gutters
  pattern     tiles, from "dense, modular SaaS UI with radius growing with size": space-16 tiles on an 80px pitch (space-16 + space-4), some merged two-wide like table cells and cards
  scales      sides space-16 (64) and multiples; gutters space-4 (16); corners radius-lg (12) on every block; disc radius-full
-->
<rect class="brand blk" x="16" y="-24" width="144" height="264" rx="12"/>
<rect class="tint blk" x="16" y="256" width="144" height="48" rx="12"/>
<rect class="tint blk" x="176" y="16" width="144" height="64" rx="12"/>
<rect class="tint blk" x="176" y="96" width="64" height="64" rx="12"/>
<rect class="tint blk" x="256" y="96" width="64" height="64" rx="12"/>
<circle class="signal" cx="288" cy="128" r="16"/>
<rect class="tint blk" x="176" y="176" width="64" height="64" rx="12"/>
<rect class="brand blk" x="256" y="176" width="64" height="64" rx="12"/>
<rect class="tint blk" x="176" y="256" width="144" height="48" rx="12"/>
<rect class="tint blk" x="336" y="16" width="64" height="64" rx="12"/>
<rect class="tint blk" x="416" y="16" width="80" height="64" rx="12"/>
<rect class="ink blk" x="336" y="96" width="160" height="208" rx="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">Lumen</h1>
<p class="tag">Quiet surfaces, one strong blue, built on a 4px grid.</p>
</div>
</div>
</body>
</html>
