<!-- @dsCard group="Examples" height=990 width=1280 page subtitle="App shell, KPIs, chart, table" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DashboardExample</title>
<style>
  html, body { margin: 0; background: var(--bg); }
  #root { min-height: 990px; display: flex; flex-direction: column; } #root > .lm-shell { flex: 1; }
</style>
</head>
<body>
<div id="root" class="lm-root"></div>
<script>

var L = window.Lumen, h = React.createElement;
function Row(label, kids, opts) {
  opts = opts || {};
  return h('div', { style: { display: 'grid', gridTemplateColumns: (opts.w || 96) + 'px 1fr', gap: 'var(--space-4)', alignItems: 'center' } },
    h('span', { style: { fontSize: 11, lineHeight: '16px', fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--fg-muted)' } }, label),
    h('div', { className: 'lm-row' }, kids));
}
function mount(App) { ReactDOM.createRoot(document.getElementById('root')).render(h(App)); }

function Bars() {
  var data = [32, 38, 35, 44, 41, 48, 52, 49, 58, 61, 57, 66];
  var months = ['N','D','J','F','M','A','M','J','J','A','S','O'];
  var W = 560, H = 200, pad = 24, bw = 28, gap = (W - pad * 2 - bw * 12) / 11, max = 70;
  return h('svg', { viewBox: '0 0 ' + W + ' ' + (H + 24), width: '100%', role: 'img', 'aria-label': 'Monthly revenue, November to October, rising from 32 to 66 thousand dollars' },
    [0, 20, 40, 60].map(function (v) { var y = H - v / max * H; return h('g', { key: v }, h('line', { x1: pad, x2: W - pad, y1: y, y2: y, stroke: 'var(--border)' }), h('text', { x: 0, y: y + 4, fontSize: 11, fill: 'var(--fg-muted)' }, v + 'k')); }),
    data.map(function (v, i) { var x = pad + i * (bw + gap), bh = v / max * H; return h('g', { key: i },
      h('rect', { x: x, y: H - bh, width: bw, height: bh, rx: 4, fill: i === 11 ? 'var(--primary)' : 'var(--fg-muted)', opacity: i === 11 ? 1 : 0.35 }),
      h('text', { x: x + bw / 2, y: H + 18, fontSize: 11, textAnchor: 'middle', fill: 'var(--fg-muted)' }, months[i])); }));
}
function Usage(label, used, total, tone) {
  var pct = Math.round(used / total * 100);
  return h('div', { key: label, style: { display: 'flex', flexDirection: 'column', gap: 6 } },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 13 } }, h('span', { style: { fontWeight: 500 } }, label), h('span', { className: 'lm-muted lm-num' }, used + ' of ' + total)),
    h('div', { style: { height: 8, borderRadius: 'var(--radius-full)', background: 'var(--surface-subtle)', border: '1px solid var(--border)', overflow: 'hidden' } },
      h('div', { style: { width: pct + '%', height: '100%', borderRadius: 'var(--radius-full)', background: tone || 'var(--primary)' } })));
}
var NAV = [
  { items: [{ label: 'Overview', icon: 'home', active: true }, { label: 'Analytics', icon: 'chart' }, { label: 'Invoices', icon: 'file', badge: 4 }, { label: 'Customers', icon: 'users' }] },
  { label: 'Workspace', items: [{ label: 'Projects', icon: 'folder' }, { label: 'Integrations', icon: 'layers' }, { label: 'Settings', icon: 'sliders' }] }
];

mount(function () {
  var B = L.Button;
  var tone = { Paid: 'success', Open: 'primary', Overdue: 'warning' };
  var ic = { Paid: 'check', Open: null, Overdue: 'alert' };
  return h('div', { className: 'lm-shell' },
    h(L.Sidebar, { sections: NAV, user: { name: 'Samira Haque', email: 'samira@northwind.io' } }),
    h('div', { className: 'lm-main' },
      h(L.Topbar, { breadcrumbs: [{ label: 'Northwind' }, { label: 'Overview' }], unread: true }),
      h('main', { className: 'lm-page' },
        h('div', { className: 'lm-page-head' },
          h('div', null, h('h1', { className: 'lm-h1' }, 'Overview'), h('p', { className: 'lm-sub' }, 'Billing activity for Northwind, October 2026.')),
          h('div', { className: 'lm-row' }, h(L.Tabs, { variant: 'segmented', label: 'Range', defaultValue: '30d', items: [{ value: '7d', label: '7d' }, { value: '30d', label: '30d' }, { value: '12m', label: '12m' }] }), h(B, { variant: 'secondary', icon: 'download' }, 'Export'), h(B, { icon: 'plus' }, 'New invoice'))),
        h('div', { className: 'lm-grid', style: { gridTemplateColumns: 'repeat(4, 1fr)' } },
          h(L.StatCard, { label: 'Revenue', value: '$66,410', delta: '15.8%', trend: 'up', caption: 'vs September', icon: 'chart' }),
          h(L.StatCard, { label: 'Outstanding', value: '$12,980', delta: '4.2%', trend: 'down', caption: 'vs September', icon: 'file' }),
          h(L.StatCard, { label: 'Customers', value: '214', delta: '9', trend: 'up', caption: 'new this month', icon: 'users' }),
          h(L.StatCard, { label: 'Avg. days to pay', value: '11.4', delta: '0', trend: 'flat', caption: 'no change', icon: 'calendar' })),
        h('div', { className: 'lm-grid', style: { gridTemplateColumns: '2fr 1fr', gap: 'var(--space-6)' } },
          h(L.Card, { title: 'Revenue', description: 'Last 12 months, in USD', actions: h(B, { variant: 'ghost', size: 'sm', icon: 'more', 'aria-label': 'Chart options' }) }, h(Bars)),
          h(L.Card, { title: 'Plan usage', description: 'Growth plan, renews Nov 14', footer: h(B, { variant: 'secondary', size: 'sm' }, 'Manage plan') },
            h('div', { className: 'lm-col' }, Usage('Seats', 18, 25), Usage('Invoices', 860, 1000, 'var(--warning)'), Usage('Storage', '3.1 GB', '20 GB')))),
        h(L.Card, { title: 'Recent invoices', flush: true, actions: h(B, { variant: 'ghost', size: 'sm', iconRight: 'arrow-right' }, 'View all') },
          h(L.Table, { caption: 'Recent invoices', columns: [
            { key: 'customer', label: 'Customer', render: function (r) { return h('div', { className: 'lm-cell-main' }, h(L.Avatar, { name: r.customer, size: 'sm', tone: 'neutral' }), r.customer); } },
            { key: 'id', label: 'Invoice', render: function (r) { return h('span', { className: 'lm-mono' }, r.id); } },
            { key: 'status', label: 'Status', render: function (r) { return h(L.Badge, { tone: tone[r.status], icon: ic[r.status] }, r.status); } },
            { key: 'date', label: 'Due' }, { key: 'amount', label: 'Amount', align: 'right' }],
            rows: [
              { id: 'INV-2041', customer: 'Globex Corp', status: 'Paid', date: 'Oct 2', amount: '$4,200.00' },
              { id: 'INV-2040', customer: 'Initech', status: 'Open', date: 'Oct 18', amount: '$1,150.00' },
              { id: 'INV-2039', customer: 'Umbrella Health', status: 'Overdue', date: 'Sep 28', amount: '$9,875.50' }] })))));
});
</script>
</body>
</html>
