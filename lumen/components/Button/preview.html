<!-- @dsCard group="Actions" height=330 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>
  html, body { margin: 0; background: var(--bg); }

</style>
</head>
<body>
<div id="root" class="lm-root"></div>
<script>

var L = window.Lumen, h = React.createElement;
function Row(label, kids, opts) {
  opts = opts || {};
  return h('div', { style: { display: 'grid', gridTemplateColumns: (opts.w || 96) + 'px 1fr', gap: 'var(--space-4)', alignItems: 'center' } },
    h('span', { style: { fontSize: 11, lineHeight: '16px', fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--fg-muted)' } }, label),
    h('div', { className: 'lm-row' }, kids));
}
function mount(App) { ReactDOM.createRoot(document.getElementById('root')).render(h(App)); }

mount(function () {
  var B = L.Button;
  return h('div', { className: 'lm-pad lm-col' },
    Row('Variants', [h(B, { key: 1 }, 'Create project'), h(B, { key: 2, variant: 'secondary' }, 'Export'), h(B, { key: 3, variant: 'ghost' }, 'Cancel'), h(B, { key: 4, variant: 'danger' }, 'Delete workspace')]),
    Row('Sizes', [h(B, { key: 1, size: 'sm' }, 'Small 32'), h(B, { key: 2 }, 'Medium 36'), h(B, { key: 3, size: 'lg' }, 'Large 44')]),
    Row('Icons', [h(B, { key: 1, icon: 'plus' }, 'New invoice'), h(B, { key: 2, variant: 'secondary', icon: 'download' }, 'Download'), h(B, { key: 3, variant: 'secondary', iconRight: 'arrow-right' }, 'Continue'), h(B, { key: 4, variant: 'secondary', icon: 'filter', 'aria-label': 'Filter' }), h(B, { key: 5, variant: 'ghost', icon: 'more', 'aria-label': 'More actions' })]),
    Row('States', [h(B, { key: 1 }, 'Default'), h(B, { key: 2, state: 'hover' }, 'Hover'), h(B, { key: 3, state: 'active' }, 'Pressed'), h(B, { key: 4, state: 'focus' }, 'Focus'), h(B, { key: 5, disabled: true }, 'Disabled'), h(B, { key: 6, loading: true }, 'Saving')]));
});
</script>
</body>
</html>
