<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select</title>
<style>
  html, body { margin: 0; background: var(--bg); }

</style>
</head>
<body>
<div id="root" class="lm-root"></div>
<script>

var L = window.Lumen, h = React.createElement;
function Row(label, kids, opts) {
  opts = opts || {};
  return h('div', { style: { display: 'grid', gridTemplateColumns: (opts.w || 96) + 'px 1fr', gap: 'var(--space-4)', alignItems: 'center' } },
    h('span', { style: { fontSize: 11, lineHeight: '16px', fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--fg-muted)' } }, label),
    h('div', { className: 'lm-row' }, kids));
}
function mount(App) { ReactDOM.createRoot(document.getElementById('root')).render(h(App)); }

mount(function () {
  return h('div', { className: 'lm-pad', style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 'var(--space-6)' } },
    h(L.Select, { label: 'Role', defaultValue: 'Editor', options: ['Owner', 'Admin', 'Editor', 'Viewer'], hint: 'Editors can change content but not billing.' }),
    h(L.Select, { label: 'Timezone', icon: 'calendar', placeholder: 'Choose a timezone', options: ['Asia/Dhaka (UTC+6)', 'Europe/London (UTC+0)', 'America/New_York (UTC-5)'] }),
    h(L.Select, { label: 'Region', options: ['Singapore'], error: 'Pick a region before continuing.' }));
});
</script>
</body>
</html>
