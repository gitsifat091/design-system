<!-- @dsCard group="Display" height=420 subtitle="Stat, content, selectable" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card</title></head>
<body>
<div class="ii-pad ii-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));align-items:start">
  <div class="ii-card">
    <div class="ii-cap">Revenue, October</div>
    <div class="ii-stat-value">৳ 4,82,500</div>
    <div class="ii-row" style="gap:8px"><span class="ii-delta-up">+12.4%</span><span class="ii-small ii-muted">vs September</span></div>
  </div>
  <div class="ii-card is-interactive is-hover">
    <div class="ii-card-media"><svg width="100%" height="100%" viewBox="0 0 300 140" preserveAspectRatio="none" aria-hidden="true"><rect x="180" y="0" width="120" height="140" style="fill:var(--ink)"/><rect x="120" y="40" width="72" height="100" style="fill:var(--brass)"/><line x1="0" y1="96" x2="300" y2="96" style="stroke:var(--line-strong)"/></svg></div>
    <div class="ii-row" style="justify-content:space-between"><span class="ii-badge ii-badge-brass">New</span><span class="ii-small ii-muted">6 min read</span></div>
    <h3 class="ii-card-title" style="margin-top:12px">Designing with restraint</h3>
    <p class="ii-muted" style="margin:4px 0 0">Why fewer colors and more space make products feel expensive.</p>
    <div class="ii-card-foot"><span class="ii-small ii-muted">Hover state</span><a class="ii-link ii-small" href="#">Read article</a></div>
  </div>
  <div class="ii-col" style="gap:12px">
    <div class="ii-card is-selected">
      <div class="ii-row" style="justify-content:space-between"><span class="ii-card-title" style="font-size:16px">Studio</span><span class="ii-radio is-on"></span></div>
      <div class="ii-stat-value" style="font-size:22px">৳ 1,200<span class="ii-small ii-muted" style="font-family:var(--font-sans)"> / month</span></div>
      <div class="ii-small ii-muted">Selected state</div>
    </div>
    <div class="ii-card">
      <div class="ii-row" style="justify-content:space-between"><span class="ii-card-title" style="font-size:16px">Solo</span><span class="ii-radio"></span></div>
      <div class="ii-stat-value" style="font-size:22px">৳ 450<span class="ii-small ii-muted" style="font-family:var(--font-sans)"> / month</span></div>
    </div>
  </div>
</div>
</body>
</html>
