<!-- @dsCard group="Examples" height=560 width=1000 subtitle="Split sign-in page" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign-in example</title></head>
<body>
<div style="display:grid;grid-template-columns:1fr 1fr;min-height:560px;background:var(--canvas)">
  <section style="background:var(--surface-sunken);color:var(--ink);border-right:1px solid var(--line);padding:var(--space-7);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden">
    <span class="ii-wordmark">Ivory <em>&amp;</em> Ink</span>
    <svg viewBox="0 0 400 200" width="100%" height="200" aria-hidden="true" style="position:absolute;right:-40px;top:120px;width:360px">
      <rect x="200" y="0" width="120" height="200" rx="2" style="fill:var(--brass)"/>
      <line x1="0" y1="60" x2="400" y2="60" style="stroke:var(--line-strong)"/>
      <line x1="0" y1="140" x2="400" y2="140" style="stroke:var(--line-strong)"/>
    </svg>
    <div style="position:relative">
      <p class="ii-serif" style="font-size:44px;line-height:48px;margin:0;letter-spacing:-0.015em">Every detail, <em style="color:var(--brass)">considered.</em></p>
      <p class="ii-muted" style="margin:12px 0 0;max-width:340px">Run your studio with tools that stay out of the way.</p>
    </div>
  </section>
  <section style="display:grid;place-items:center;padding:var(--space-7)">
    <form class="ii-col" style="width:100%;max-width:360px;gap:var(--space-5)" onsubmit="return false">
      <div><h1 style="font-size:24px;line-height:32px;font-weight:600;margin:0;letter-spacing:-0.01em">Sign in</h1><p class="ii-muted" style="margin:4px 0 0">Welcome back. Enter your details.</p></div>
      <div class="ii-field"><label class="ii-label">Email</label><div class="ii-input-wrap"><span class="ii-affix"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></span><input class="ii-input" placeholder="you@studio.com"></div></div>
      <div class="ii-field"><div class="ii-row" style="justify-content:space-between"><label class="ii-label">Password</label><a class="ii-link ii-small" href="#">Forgot?</a></div><input class="ii-input" type="password" placeholder="At least 8 characters"></div>
      <label class="ii-check ii-small"><span class="ii-box is-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span>Keep me signed in</label>
      <button class="ii-btn ii-btn-primary ii-btn-lg" style="width:100%">Sign in</button>
      <div class="ii-row" style="gap:12px"><hr class="ii-divider" style="flex:1"><span class="ii-small ii-muted">or</span><hr class="ii-divider" style="flex:1"></div>
      <button class="ii-btn ii-btn-secondary ii-btn-lg" style="width:100%">Continue with a passkey</button>
      <p class="ii-small ii-muted" style="margin:0;text-align:center">New here? <a class="ii-link" href="#">Create an account</a></p>
    </form>
  </section>
</div>
</body>
</html>
