<!-- @dsCard group="Forms" height=230 subtitle="Checkbox, radio, toggle, segmented" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Selection</title></head>
<body>
<div class="ii-pad ii-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));max-width:760px">
  <div class="ii-col" style="gap:12px">
    <div class="ii-cap">Checkbox</div>
    <label class="ii-check"><span class="ii-box is-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span>Email receipts</label>
    <label class="ii-check"><span class="ii-box"></span>Weekly digest</label>
    <label class="ii-check"><span class="ii-box is-focus"></span>Focus</label>
    <label class="ii-check is-disabled"><span class="ii-box"></span>Disabled</label>
  </div>
  <div class="ii-col" style="gap:12px">
    <div class="ii-cap">Radio</div>
    <label class="ii-check"><span class="ii-radio is-on"></span>Monthly</label>
    <label class="ii-check"><span class="ii-radio"></span>Yearly</label>
    <label class="ii-check"><span class="ii-radio is-focus"></span>Focus</label>
    <label class="ii-check is-disabled"><span class="ii-radio"></span>Disabled</label>
  </div>
  <div class="ii-col" style="gap:12px">
    <div class="ii-cap">Toggle</div>
    <label class="ii-check"><span class="ii-toggle is-on"></span>Dark mode</label>
    <label class="ii-check"><span class="ii-toggle"></span>Auto-save</label>
    <div class="ii-cap" style="margin-top:8px">Segmented</div>
    <div class="ii-seg"><button class="is-on">Day</button><button>Week</button><button>Month</button></div>
  </div>
</div>
</body>
</html>
