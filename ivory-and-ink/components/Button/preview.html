<!-- @dsCard group="Actions" height=300 subtitle="Variants, sizes, states" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="ii-pad ii-col">
  <div class="ii-cap">Variants</div>
  <div class="ii-row">
    <button class="ii-btn ii-btn-primary">Save changes</button>
    <button class="ii-btn ii-btn-secondary">Cancel</button>
    <button class="ii-btn ii-btn-ghost">Learn more</button>
    <button class="ii-btn ii-btn-accent">Upgrade plan <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="ii-btn ii-btn-danger">Delete</button>
    <button class="ii-btn ii-btn-secondary ii-btn-icon" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="ii-cap">Sizes</div>
  <div class="ii-row">
    <button class="ii-btn ii-btn-primary ii-btn-sm">Small</button>
    <button class="ii-btn ii-btn-primary">Medium</button>
    <button class="ii-btn ii-btn-primary ii-btn-lg">Large</button>
  </div>
  <div class="ii-cap">States</div>
  <div class="ii-row">
    <button class="ii-btn ii-btn-primary">Default</button>
    <button class="ii-btn ii-btn-primary is-hover">Hover</button>
    <button class="ii-btn ii-btn-primary is-focus">Focus</button>
    <button class="ii-btn ii-btn-primary is-loading">Saving</button>
    <button class="ii-btn ii-btn-primary" disabled>Disabled</button>
  </div>
</div>
</body>
</html>
